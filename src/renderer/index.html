<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: sonara-cover: blob:; media-src 'self' sonara-track: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" />
    <title>Sonara</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-theme="dark" data-tracks-view="grid">
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <defs>
                <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stop-color="#7c5cff" />
                  <stop offset="100%" stop-color="#21d4fd" />
                </linearGradient>
              </defs>
              <circle cx="16" cy="16" r="14" fill="url(#g)" />
              <path d="M11 21 V11 L21 16 Z" fill="#0b0f17" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Sonara</span>
            <span class="brand-version" id="brandVersion">v0.0.0</span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item" data-view="home"><span class="ico">⌂</span> Главная</button>
          <button class="nav-item" data-view="tracks"><span class="ico">♪</span> Треки</button>
          <button class="nav-item" data-view="playlists"><span class="ico">≡</span> Плейлисты</button>
          <button class="nav-item" data-view="wave"><span class="ico">~</span> Моя волна</button>
          <button class="nav-item" data-view="settings"><span class="ico">⚙</span> Настройки</button>
        </nav>

        <div class="sidebar-footer">
          <div class="update-banner" id="updateBanner" hidden>
            <div class="ub-text">
              <strong id="ubTitle">Доступно обновление</strong>
              <span id="ubSub"></span>
            </div>
            <div class="ub-progress" id="ubProgress" hidden>
              <div class="ub-progress-bar" id="ubProgressBar"></div>
            </div>
            <div class="ub-actions">
              <button class="btn btn-primary btn-sm" id="ubAction">Обновить</button>
              <button class="btn btn-ghost btn-sm" id="ubDismiss">Позже</button>
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <h1 class="view-title" id="viewTitle">Главная</h1>
          </div>
          <div class="topbar-right">
            <div class="search">
              <input id="searchInput" type="search" placeholder="Поиск по библиотеке" autocomplete="off" />
            </div>
          </div>
        </header>

        <section class="view" id="view"></section>
      </main>
    </div>

    <footer class="player" id="player">
      <div class="player-track">
        <div class="player-cover" id="playerCover"></div>
        <div class="player-meta">
          <div class="player-title" id="playerTitle">Ничего не играет</div>
          <div class="player-artist" id="playerArtist">—</div>
        </div>
        <button class="btn btn-icon" id="likeBtn" title="Лайк">♥</button>
      </div>

      <div class="player-controls">
        <div class="controls-row">
          <button class="btn btn-icon" id="shuffleBtn" title="Перемешать">⇄</button>
          <button class="btn btn-icon" id="prevBtn" title="Предыдущий">⏮</button>
          <button class="btn btn-icon btn-play" id="playBtn" title="Воспроизвести">▶</button>
          <button class="btn btn-icon" id="nextBtn" title="Следующий">⏭</button>
          <button class="btn btn-icon" id="repeatBtn" title="Повтор">⟲</button>
        </div>
        <div class="progress-row">
          <span class="time" id="timeCur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" />
          <span class="time" id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="player-extra">
        <span class="vol-icon" aria-hidden="true">🔊</span>
        <input type="range" id="volume" min="0" max="100" value="80" />
      </div>

      <audio id="audio" preload="auto"></audio>
    </footer>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
